runtime: python311
instance_class: F1
default_expiration: "0s"

handlers:
  # Static fingerprinted assets (JS, CSS, hashed media)
  - url: /assets
    static_dir: dist/assets
    expiration: "365d"
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"
      X-Content-Type-Options: nosniff

  # Static root discovery, icons, and agent crawler files
  - url: /(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|ai-catalog\.json|favicon\.(ico|svg|png)|apple-touch-icon\.png|favicon-[0-9]+x[0-9]+\.png)
    static_files: dist/\1
    upload: dist/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|ai-catalog\.json|favicon\.(ico|svg|png)|apple-touch-icon\.png|favicon-[0-9]+x[0-9]+\.png)
    expiration: "1d"
    http_headers:
      Cache-Control: "public, max-age=86400"

  # Well-known discovery manifests for AI agent discovery
  - url: /.well-known/(ai-catalog\.json|ard\.json)
    static_files: dist/.well-known/\1
    upload: dist/.well-known/(ai-catalog\.json|ard\.json)
    expiration: "1d"
    http_headers:
      Cache-Control: "public, max-age=86400"
      X-Content-Type-Options: nosniff

  # Single Page Application fallback for HTML
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    http_headers:
      Cache-Control: "public, max-age=0, must-revalidate"
      X-Frame-Options: DENY
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
